name: Test SatoTag
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[governance]"
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_demo.py --check
      - name: Verify key authority fixture
        run: python -m tools.keyring_demo --check
      - run: python -m tools.evidence_demo --check
      - run: python -m tools.replay_binance_sample --check
