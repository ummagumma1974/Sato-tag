[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satotag"
version = "0.1.0"
description = "Offline research prototype for persistent, evidence-linked UTXO exposure marks"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "SatoTag contributors"}]
dependencies = []

[project.scripts]
satotag = "satotag.__main__:main"

[tool.setuptools.packages.find]
include = ["satotag*"]
